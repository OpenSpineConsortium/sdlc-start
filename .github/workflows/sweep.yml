name: Sweep

# Installing the App is a request too. GitHub sends an App's installation
# events only to a webhook, which needs a server, and an installation is
# no repository event, so no workflow runs on it; what needs no server is
# this sweep. Every ten minutes it signs the App's JWT, lists the App's
# installations and their repositories, and for each repository the App
# reaches that has no adoption yet (no branch symphony/adopt, no
# docs/agents/PROTOCOL.md on the default branch, a commit to go into, and
# no .github/symphony-adopt saying off) it starts adopt-run.yml by dispatch,
# with the installation's and the repository's ids and the kind the tree
# shows: a default branch holding nothing but what GitHub makes when it
# initializes a repository (a README, a LICENSE or COPYING, a .gitignore
# or .gitattributes) is a new one; anything else is an existing one. The
# form stays the fast path, answered within a minute, and the form wins:
# an installation younger than half an hour is left alone, so a person
# who installs and then fills in the form keeps their choices, and a
# repository named on an open request here is left to that request. An
# installation that has not accepted every permission the pull request
# needs is passed over, as is a repository whose Issues are off (the
# run tells it in an issue when it fails), one whose adoption was offered
# (the branch symphony/adopt), declined (a closed pull request from it),
# refused (the App's issue "Symphony could not open its pull
# request", open), or opted out (.github/symphony-adopt saying off); and the
# organization's own repositories, which use the form. Nothing of a
# repository reaches this public log: scripts/sweep.py prints counts, the
# candidates go to a file of the run, and the dispatch carries ids, never
# names. The sweep has a time budget under the JWT's life, writes each
# candidate as it is found and dispatches what it found even when cut
# short, and starts from a different installation each time, so one
# large installation cannot starve the rest. Two sweeps never overlap.
# GitHub stops a public repository's scheduled workflows after 60 days
# without a commit, which the owner re-enables from the Actions tab;
# this repository's own pull requests keep it active in practice.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: vars.SDLC_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The JWT is what lists installations; it is masked and travels in
      # the job's environment, and the key never touches a file.
      - name: Sign the App's JWT
        env:
          APP_ID: ${{ vars.SDLC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
        run: |
          jwt="$(bash scripts/jwt.sh)"
          echo "::add-mask::$jwt"
          echo "APP_JWT=$jwt" >> "$GITHUB_ENV"

      # A request still open on the form's path names its repository in a
      # public issue; the sweep leaves those repositories to their request.
      # gh writes the issues to a file that sweep.py reads, so the bodies
      # never go through a shell pipe (a heredoc on the same command would
      # take the pipe's place as stdin) and the parsing has tests.
      - name: List the open requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label adopt --state open --limit 100 --json body > "$RUNNER_TEMP/requests.json"
          echo "open requests: $(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/requests.json")"

      - name: Find the repositories that have the App and no adoption
        run: |
          python3 scripts/sweep.py --own "${GITHUB_REPOSITORY_OWNER}" --requests "$RUNNER_TEMP/requests.json" \
            --budget-seconds 420 --out "$RUNNER_TEMP/candidates"

      # One run per repository, by ids; the run resolves and masks the name.
      # Also after a sweep cut short, which wrote what it found.
      - name: Start one adoption run per repository
        if: always() && env.APP_JWT != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=0
          [ -f "$RUNNER_TEMP/candidates" ] || : > "$RUNNER_TEMP/candidates"
          while IFS=$'\t' read -r installation repository mode; do
            [ -n "$repository" ] || continue
            gh workflow run adopt-run.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f installation_id="$installation" -f repository_id="$repository" -f mode="$mode" -f metrics=on
            started=$((started + 1))
          done < "$RUNNER_TEMP/candidates"
          echo "adoption runs started: $started"
