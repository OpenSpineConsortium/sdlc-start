name: Adopt

# Turns an adoption request made on this repository's form into a pull
# request in the requester's own repository. The template,
# OpenSpineConsortium/symphony-template, stays internal to its enterprise, so
# nobody outside it can press "Use this template"; this public repository
# is the front door instead. A person installs the Symphony App on
# their repository and opens the form .github/ISSUE_TEMPLATE/adopt.yml,
# which labels the issue adopt and starts this workflow. The install
# itself ends on the form: the App's Setup URL is the form, and GitHub
# sends the person there with the installation's number filled in, so the
# form carries either a repository's name or that number, and installing
# the App alone asks for nothing. This workflow reads the form, checks
# the author and the App's reach, answers what it refuses, and then calls
# adopt-run.yml, which does the adoption itself for both of the form's
# paths and whose header says how.
#
# Both Apps are required on the form's two paths: SymphonyBoard, which
# opens the pull request, and Symphony Setup, which applies the
# repository's settings for the one run (the default branch's ruleset,
# delete-on-merge and auto-merge, the topic symphony, secret scanning
# with push protection and, for the whole template, letting GitHub
# Actions create and approve pull requests) and uninstalls itself
# afterwards. Installing the Setup App on the repository is the
# person's consent to those settings, so a named
# repository without it is refused with its install link, which brings
# the person back to the form with the repository filled in, unless it
# is adopted already, which is the answer then, since the run would
# refuse it anyway; and an installation's request takes only a
# repository the Setup App reaches too.
#
# Anyone can open an issue here, so everything the issue says is data: the
# body reaches scripts/adopt.py parse through env:, never through an
# expression inside run:, and parse refuses anything the form would not
# write. The App's tokens come in an order that tells a stranger nothing
# about a repository they name. The first is for the named account alone,
# with metadata read: whether it can be made says only whether that
# account, which is public, installed the App. With it the run asks for the
# repository and for the author's permission there, both silenced, so a
# repository the App does not reach reads the same as an author who is not
# an administrator, and both get one answer. When the first token cannot
# be made, a probe on the App's own account tells a broken App (a wrong id
# or key here, which is the owner's to fix: the issue stays open and the
# run ends red) from an account that did not install it. A form that
# carries the installation's number and no name is resolved with the
# App's own JWT, or the Setup App's when the number is that App's, since
# both send the person to the form (scripts/resolve.py): the installation's
# token lists the repositories it reaches, and the newest one with no
# adoption yet (by scripts/sweep.py's rules, asked by id, or with no
# commit at all, whose first commit the run makes) that the author
# administers and the Setup App is installed on is adopted, one per
# press, since one press that reached every repository of an account
# merged the adoption into eight on 2026-10-11; the person presses Create
# again for the next. None, a number neither App knows, an author who
# administers none and a Setup App on none get one answer at one moment,
# and no name is read in this job, so nothing here can be masked and
# nothing printed can differ: a guessed number learns nothing. Where the
# Setup App is missing from a named repository whose administrator asked,
# one more token, for that repository alone with contents read, asks
# whether it is adopted already. GitHub's own
# token, which may write only this repository's issues, posts every
# answer. A refusal (scripts/refuse.sh) comments, closes the issue as not
# planned and ends the run green; anything else that fails comments with
# the run's link and leaves the issue open for the owner. The trigger is
# opened and reopened, never edited: a refused request is opened again
# with the form, and one reopened is answered again; one run handles one
# issue at a time. Until the owner sets
# the variable SDLC_APP_ID and the secret SDLC_APP_PRIVATE_KEY (README.md,
# For the owner), every request is answered that the front door is not
# set up yet, and stays open so its run can be started again once it is;
# a request opened before the label adopt exists here carries no label,
# starts no run and is never answered, so it has to be opened again.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

concurrency:
  group: adopt-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  request:
    if: contains(github.event.issue.labels.*.name, 'adopt')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      refused: ${{ steps.verdict.outputs.refused }}
      repository: ${{ steps.form.outputs.repository }}
      installation_id: ${{ steps.resolve.outputs.installation_id }}
      repository_ids: ${{ steps.resolve.outputs.repository_ids }}
      count: ${{ steps.resolve.outputs.count }}
      mode: ${{ steps.form.outputs.mode }}
      metrics: ${{ steps.form.outputs.metrics }}
      merge: ${{ steps.form.outputs.merge }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: start
          persist-credentials: false

      # Only whether the key is set reaches the shell, never the key.
      - name: Stop while the front door is not set up
        env:
          APP_ID: ${{ vars.SDLC_APP_ID }}
          KEY_SET: ${{ secrets.SDLC_APP_PRIVATE_KEY != '' }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APP_ID" ] || [ "$KEY_SET" != true ]; then
            bash start/scripts/refuse.sh --keep-open "Nothing was done yet: this front door has not been given the Symphony App by its owner. This issue stays open, and its run can be started again once that is done."
          fi

      - name: Read the form
        id: form
        if: env.REFUSED != 'true'
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          if printf '%s' "$BODY" | python3 start/scripts/adopt.py parse > "$RUNNER_TEMP/form" 2> "$RUNNER_TEMP/reason"; then
            cat "$RUNNER_TEMP/form" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/form"
          else
            reason="$(head -n 1 "$RUNNER_TEMP/reason")"
            bash start/scripts/refuse.sh "Nothing was done: ${reason}. Open a new request with the form once that is put right; this one is closed."
          fi

      # The form came from the install: the installation's number and no
      # name. scripts/resolve.py turns it into the repository to adopt,
      # the newest the installation and the Setup App both reach, by id;
      # nothing of a repository is printed, and every refusal is the same
      # one.
      - name: Resolve the installation to the repositories to adopt
        id: resolve
        if: env.REFUSED != 'true' && steps.form.outputs.repository == ''
        env:
          APP_ID: ${{ vars.SDLC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          SETUP_ID: ${{ vars.SDLC_SETUP_APP_ID }}
          SETUP_KEY: ${{ secrets.SDLC_SETUP_APP_PRIVATE_KEY }}
          INSTALLATION: ${{ steps.form.outputs.installation }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Every refusal is one answer, in words and in time: the names are
          # never learned here (scripts/resolve.py asks the API by id), so
          # no mask exists in this job and nothing printed can differ; and
          # each refusal waits for the same moment, so the step's length
          # says nothing.
          refusal="Nothing was done: the installation this form carried is not the Symphony App's or its Setup App's, or it reaches no repository with no adoption yet, or none of those that your account administers, or Symphony Setup is not installed on it. Install Symphony Setup on the repository, https://github.com/apps/symphony-setup/installations/new (\"Only select repositories\", that one): it brings you back to this form; press Create. Or open a new request with the form naming the repository as OWNER/NAME, as an administrator of it; this one is closed."
          deadline=$((SECONDS + 25))
          refuse_alike() {
            sleep $((deadline > SECONDS ? deadline - SECONDS : 0))
            bash start/scripts/refuse.sh "$refusal"
          }
          jwt="$(bash start/scripts/jwt.sh)"
          echo "::add-mask::$jwt"
          setup_jwt=""
          if [ -n "$SETUP_ID" ] && [ -n "$SETUP_KEY" ]; then
            setup_jwt="$(APP_ID="$SETUP_ID" APP_PRIVATE_KEY="$SETUP_KEY" bash start/scripts/jwt.sh)"
            echo "::add-mask::$setup_jwt"
          fi
          if APP_JWT="$jwt" SETUP_JWT="$setup_jwt" python3 start/scripts/resolve.py \
               --installation "$INSTALLATION" --author "$AUTHOR" --out "$RUNNER_TEMP/resolved" 2> "$RUNNER_TEMP/resolve-said"; then
            code=0
          else
            code=$?
          fi
          case "$code" in
            0) cat "$RUNNER_TEMP/resolved" >> "$GITHUB_OUTPUT" ;;
            3) refuse_alike ;;
            4) bash start/scripts/refuse.sh --keep-open "Nothing was done yet: this front door's App is not working (its id or private key here is wrong, or GitHub did not answer), which is for the owner of this repository to put right; the run is $RUN. This issue stays open, and its run can be started again once that is done."
               exit 1 ;;
            *) echo "the installation could not be resolved: $(head -n 1 "$RUNNER_TEMP/resolve-said")"
               exit 1 ;;
          esac

      # For the account alone, with metadata read: it fails only when that
      # account did not install the App, and says nothing about the
      # repository, on which the log would otherwise carry a verdict.
      - uses: actions/create-github-app-token@v1
        id: account-token
        if: env.REFUSED != 'true' && steps.form.outputs.repository != ''
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ steps.form.outputs.owner }}
          permission-metadata: read

      # Only after the mint above failed, on the App's own account, which
      # installed it: a failure here is the App's id or key, not the
      # requester.
      - uses: actions/create-github-app-token@v1
        id: app-probe
        if: env.REFUSED != 'true' && steps.form.outputs.repository != '' && steps.account-token.outcome == 'failure'
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: OpenSpineConsortium
          permission-metadata: read

      # Both lookups are silenced: a repository the App does not reach
      # reads as none, the same as an author without admin rights, and the
      # log says nothing about the repository either way.
      - name: Check that the App reaches the repository and the author administers it
        if: env.REFUSED != 'true' && steps.form.outputs.repository != ''
        env:
          ACCOUNT_OUTCOME: ${{ steps.account-token.outcome }}
          PROBE_OUTCOME: ${{ steps.app-probe.outcome }}
          GH_TOKEN: ${{ steps.account-token.outputs.token }}
          TARGET: ${{ steps.form.outputs.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          permission=none
          if [ "$ACCOUNT_OUTCOME" = success ]; then
            if gh api "repos/$TARGET" --silent 2>/dev/null; then
              permission="$(gh api "repos/$TARGET/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)"
            fi
          elif [ "$PROBE_OUTCOME" != success ]; then
            bash start/scripts/refuse.sh --keep-open "Nothing was done yet: this front door's App is not working (its id or private key here is wrong, or GitHub did not answer), which is for the owner of this repository to put right; the run is $RUN. This issue stays open, and its run can be started again once that is done."
            exit 1
          fi
          if [ "$permission" != admin ]; then
            bash start/scripts/refuse.sh "Nothing was done: the Symphony App is not installed on $TARGET, or not given that repository, or your account is not one of its administrators. Install the App at https://github.com/apps/symphonyboard/installations/new and choose the repository, then open a new request with the form as an administrator of it; this one is closed."
          fi

      # Only whether the Setup App's key is set reaches the shell, never
      # the key. Without the pair this front door has no Setup App, and
      # the request goes on without the check below: the pull request then
      # says the settings are left to the steps by hand.
      - name: Say whether this front door has the Setup App
        if: env.REFUSED != 'true' && steps.form.outputs.repository != ''
        env:
          SETUP_ID: ${{ vars.SDLC_SETUP_APP_ID }}
          SETUP_KEY_SET: ${{ secrets.SDLC_SETUP_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$SETUP_ID" ] && [ "$SETUP_KEY_SET" = true ]; then
            echo "SETUP_APP=present" >> "$GITHUB_ENV"
          else
            echo "SETUP_APP=absent" >> "$GITHUB_ENV"
          fi

      # The Setup App on the named repository, with metadata read: the
      # mint fails where the person did not install it there, and
      # installing it is their consent to the settings, so the check below
      # refuses without it. The token is used for nothing; the run mints
      # the one that applies the settings, and this job holds none that
      # could change anything.
      - uses: actions/create-github-app-token@v1
        id: setup-token
        if: env.REFUSED != 'true' && steps.form.outputs.repository != '' && env.SETUP_APP == 'present'
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_SETUP_APP_ID }}
          private-key: ${{ secrets.SDLC_SETUP_APP_PRIVATE_KEY }}
          owner: ${{ steps.form.outputs.owner }}
          repositories: ${{ steps.form.outputs.name }}
          permission-metadata: read

      # Only after that mint failed, on the owner's own installation of
      # the Setup App, which is on this repository: a failure here is the
      # Setup App's id or key, not the requester, as adopt-run.yml tells
      # the two apart the same way.
      - uses: actions/create-github-app-token@v1
        id: setup-probe
        if: env.REFUSED != 'true' && steps.form.outputs.repository != '' && env.SETUP_APP == 'present' && steps.setup-token.outcome == 'failure'
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_SETUP_APP_ID }}
          private-key: ${{ secrets.SDLC_SETUP_APP_PRIVATE_KEY }}
          owner: OpenSpineConsortium
          repositories: symphony-start
          permission-metadata: read

      # Only where the Setup App is missing from the named repository and
      # works: the App's token for that one repository, with contents
      # read, to ask scripts/adopted.py whether it is adopted already, as
      # the run asks before anything else. An adopted repository is then
      # told so at once, instead of being sent to install the Setup App,
      # which holds Administration, for a request the run would refuse.
      # Its administrator asked, by the check above, and the name is
      # public already, typed on this issue; the token is revoked when the
      # job ends.
      - uses: actions/create-github-app-token@v1
        id: contents-token
        if: env.REFUSED != 'true' && steps.form.outputs.repository != '' && env.SETUP_APP == 'present' && steps.setup-token.outcome == 'failure' && steps.setup-probe.outcome == 'success'
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ steps.form.outputs.owner }}
          repositories: ${{ steps.form.outputs.name }}
          permission-contents: read

      # The refusal's install link preselects the account and the
      # repository by their ids and carries the name as state, which
      # GitHub returns to the Setup URL, so the install brings the person
      # back to the form with the repository filled in. The ids are read
      # on the account token, which the step above showed reaches the
      # repository; the name is public already, typed on this issue. A
      # repository adopted already gets the run's own answer instead; a
      # question GitHub does not answer leaves that to the run, which asks
      # again once the Setup App is there.
      - name: Check that the Setup App is installed on the repository
        if: env.REFUSED != 'true' && steps.form.outputs.repository != '' && env.SETUP_APP == 'present'
        env:
          SETUP_OUTCOME: ${{ steps.setup-token.outcome }}
          PROBE_OUTCOME: ${{ steps.setup-probe.outcome }}
          CONTENTS_OUTCOME: ${{ steps.contents-token.outcome }}
          CONTENTS_TOKEN: ${{ steps.contents-token.outputs.token }}
          GH_TOKEN: ${{ steps.account-token.outputs.token }}
          TARGET: ${{ steps.form.outputs.repository }}
          ISSUE_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SETUP_OUTCOME" = success ]; then
            echo "the Setup App is installed on the repository"
            exit 0
          fi
          if [ "$PROBE_OUTCOME" != success ]; then
            bash start/scripts/refuse.sh --keep-open "Nothing was done yet: this front door's Setup App is not working (its id or private key here is wrong, or GitHub did not answer), which is for the owner of this repository to put right; the run is $RUN. This issue stays open, and its run can be started again once that is done."
            exit 1
          fi
          if [ "$CONTENTS_OUTCOME" = success ]; then
            adopted=0
            GH_TOKEN="$CONTENTS_TOKEN" python3 start/scripts/adopted.py "$TARGET" 2> "$RUNNER_TEMP/adopted-said" || adopted=$?
            if [ "$adopted" = 3 ]; then
              bash start/scripts/refuse.sh "$(python3 start/scripts/adopted.py --answer)"
              exit 0
            fi
          fi
          OWNER_ID="$(gh api "repos/$TARGET" --jq .owner.id)"
          REPOSITORY_ID="$(gh api "repos/$TARGET" --jq .id)"
          bash start/scripts/refuse.sh "Nothing was done: Symphony Setup is not installed on $TARGET. It applies the repository's settings for the one run (the default branch's ruleset, delete-on-merge and auto-merge, the topic symphony, secret scanning with push protection and, for the whole template, letting GitHub Actions create and approve pull requests) and uninstalls itself afterwards, so an adoption needs both Apps. Install it at https://github.com/apps/symphony-setup/installations/new/permissions?suggested_target_id=$OWNER_ID&repository_ids[]=$REPOSITORY_ID&state=$TARGET (\"Only select repositories\", that one): it brings you back to the form with the repository filled in; press Create. This one is closed."

      # What the second job reads: a refusal here means nothing to adopt.
      - name: Say whether the request goes on
        id: verdict
        if: always()
        run: echo "refused=${REFUSED:-false}" >> "$GITHUB_OUTPUT"

      # Not after a refusal, which said what was wrong already; that holds
      # for the one about a broken App, which ends the run red on purpose.
      - name: Say so when something failed
        if: failure() && env.REFUSED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Something went wrong while handling this request, and it stopped; the run is $RUN. This issue stays open for the owner of this repository to look at."

  # The adoption itself; the secrets it needs are this repository's own.
  # A named repository is one run, which answers the issue itself.
  adopt:
    needs: request
    if: needs.request.result == 'success' && needs.request.outputs.refused != 'true' && needs.request.outputs.repository != ''
    uses: ./.github/workflows/adopt-run.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      mode: ${{ needs.request.outputs.mode }}
      metrics: ${{ needs.request.outputs.metrics }}
      merge: ${{ needs.request.outputs.merge }}
      requester: ${{ github.event.issue.user.login }}
      issue: ${{ github.event.issue.number }}
    secrets: inherit

  # An installation is one run, for the newest repository it reaches with
  # no adoption yet that the Setup App reaches too (scripts/resolve.py
  # gives one per press), by ids; the matrix keeps the list's shape, and
  # the issue is answered once, below.
  adopt_each:
    needs: request
    if: needs.request.result == 'success' && needs.request.outputs.refused != 'true' && needs.request.outputs.repository_ids != ''
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repository_id: ${{ fromJson(needs.request.outputs.repository_ids || '[]') }}
    uses: ./.github/workflows/adopt-run.yml
    with:
      installation_id: ${{ needs.request.outputs.installation_id }}
      repository_id: ${{ matrix.repository_id }}
      mode: ${{ needs.request.outputs.mode }}
      metrics: ${{ needs.request.outputs.metrics }}
      merge: ${{ needs.request.outputs.merge }}
      requester: ${{ github.event.issue.user.login }}
      issue: ${{ github.event.issue.number }}
      answer: caller
    secrets: inherit

  # One answer for the installation's repositories, naming none: how many
  # pull requests are open, and whether every run finished. A run that
  # refused its repository (scripts/refuse.sh: no commit, a branch
  # symphony/adopt there already, the protocol's text that cannot be
  # written, a push turned away) has answered the issue already, with why,
  # and closed it as not planned, and ends green; so an issue no longer
  # open is left as it is, whoever closed it, since these words would say
  # a pull request is open where none was opened. One press is one
  # repository, so that refusal is the request's whole answer.
  answer:
    needs: [request, adopt_each]
    if: always() && needs.request.result == 'success' && needs.request.outputs.refused != 'true' && needs.request.outputs.repository_ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ISSUE: ${{ github.event.issue.number }}
      COUNT: ${{ needs.request.outputs.count }}
      RESULT: ${{ needs.adopt_each.result }}
      MERGE: ${{ needs.request.outputs.merge }}
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Answer the request and close it
        run: |
          state="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$state" != OPEN ]; then
            echo "the request was answered and closed already; nothing more to say"
            exit 0
          fi
          if [ "$COUNT" = 1 ]; then
            opened="the pull request is open in your repository"
          else
            opened="$COUNT pull requests are open, one in each of your repositories the installation reaches with no adoption yet"
          fi
          merged=""
          if [ "$MERGE" = true ]; then
            merged=" Each is merged, or has auto-merge armed where the repository's rules require its check; one the run could not merge is left to you, and the pull request stays open."
          fi
          if [ "$RESULT" = success ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Done: $opened, from the branch symphony/adopt; each lists every file it brings and the steps that are left, and a new repository has the issue \"Set up this project\" too.$merged This issue is closed."
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "At least one of the $COUNT adoptions stopped with a failure; the others may be done. The run is $RUN. This issue stays open for the owner of this repository to look at. If a run pushed a branch symphony/adopt to a repository before it stopped, delete that branch before a new request."
          fi
