name: Adopt

# Turns an adoption request made on this repository's form into a pull
# request in the requester's own repository. The template,
# OpenSpineConsortium/sdlc-template, stays internal to its enterprise, so
# nobody outside it can press "Use this template"; this public repository
# is the front door instead. A person installs the OpenSpine SDLC App on
# their repository and either opens the form .github/ISSUE_TEMPLATE/adopt.yml,
# which labels the issue adopt and starts this workflow, or does nothing
# more and lets the sweep (sweep.yml) find the installation. This workflow
# is the issue path: it reads the form, checks the author and the App's
# reach, answers what it refuses, and then calls adopt-run.yml, which does
# the adoption itself for both paths and whose header says how.
#
# Anyone can open an issue here, so everything the issue says is data: the
# body reaches scripts/adopt.py parse through env:, never through an
# expression inside run:, and parse refuses anything the form would not
# write. The App's tokens come in an order that tells a stranger nothing
# about a repository they name. The first is for the named account alone,
# with metadata read: whether it can be made says only whether that
# account, which is public, installed the App. With it the run asks for the
# repository and for the author's permission there, both silenced, so a
# repository the App does not reach reads the same as an author who is not
# an administrator, and both get one answer. When the first token cannot
# be made, a probe on the App's own account tells a broken App (a wrong id
# or key here, which is the owner's to fix: the issue stays open and the
# run ends red) from an account that did not install it. GitHub's own
# token, which may write only this repository's issues, posts every
# answer. A refusal (scripts/refuse.sh) comments, closes the issue as not
# planned and ends the run green; anything else that fails comments with
# the run's link and leaves the issue open for the owner. The trigger is
# opened and reopened, never edited: a refused request is opened again
# with the form, and one reopened is answered again, so a closed refusal
# cannot be held open to keep its repository on the sweep's pending list;
# one run handles one issue at a time. Until the owner sets
# the variable SDLC_APP_ID and the secret SDLC_APP_PRIVATE_KEY (README.md,
# For the owner), every request is answered that the front door is not
# set up yet, and stays open so its run can be started again once it is;
# a request opened before the label adopt exists here carries no label,
# starts no run and is never answered, so it has to be opened again.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

concurrency:
  group: adopt-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  request:
    if: contains(github.event.issue.labels.*.name, 'adopt')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      refused: ${{ steps.verdict.outputs.refused }}
      repository: ${{ steps.form.outputs.repository }}
      mode: ${{ steps.form.outputs.mode }}
      metrics: ${{ steps.form.outputs.metrics }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: start
          persist-credentials: false

      # Only whether the key is set reaches the shell, never the key.
      - name: Stop while the front door is not set up
        env:
          APP_ID: ${{ vars.SDLC_APP_ID }}
          KEY_SET: ${{ secrets.SDLC_APP_PRIVATE_KEY != '' }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APP_ID" ] || [ "$KEY_SET" != true ]; then
            bash start/scripts/refuse.sh --keep-open "Nothing was done yet: this front door has not been given the OpenSpine SDLC App by its owner. This issue stays open, and its run can be started again once that is done."
          fi

      - name: Read the form
        id: form
        if: env.REFUSED != 'true'
        env:
          BODY: ${{ github.event.issue.body }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          if printf '%s' "$BODY" | python3 start/scripts/adopt.py parse > "$RUNNER_TEMP/form" 2> "$RUNNER_TEMP/reason"; then
            cat "$RUNNER_TEMP/form" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/form"
          else
            reason="$(head -n 1 "$RUNNER_TEMP/reason")"
            bash start/scripts/refuse.sh "Nothing was done: ${reason}. Open a new request with the form once that is put right; this one is closed."
          fi

      # For the account alone, with metadata read: it fails only when that
      # account did not install the App, and says nothing about the
      # repository, on which the log would otherwise carry a verdict.
      - uses: actions/create-github-app-token@v1
        id: account-token
        if: env.REFUSED != 'true'
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ steps.form.outputs.owner }}
          permission-metadata: read

      # Only after the mint above failed, on the App's own account, which
      # installed it: a failure here is the App's id or key, not the
      # requester.
      - uses: actions/create-github-app-token@v1
        id: app-probe
        if: env.REFUSED != 'true' && steps.account-token.outcome == 'failure'
        continue-on-error: true
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: OpenSpineConsortium
          permission-metadata: read

      # Both lookups are silenced: a repository the App does not reach
      # reads as none, the same as an author without admin rights, and the
      # log says nothing about the repository either way.
      - name: Check that the App reaches the repository and the author administers it
        if: env.REFUSED != 'true'
        env:
          ACCOUNT_OUTCOME: ${{ steps.account-token.outcome }}
          PROBE_OUTCOME: ${{ steps.app-probe.outcome }}
          GH_TOKEN: ${{ steps.account-token.outputs.token }}
          TARGET: ${{ steps.form.outputs.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          permission=none
          if [ "$ACCOUNT_OUTCOME" = success ]; then
            if gh api "repos/$TARGET" --silent 2>/dev/null; then
              permission="$(gh api "repos/$TARGET/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)"
            fi
          elif [ "$PROBE_OUTCOME" != success ]; then
            bash start/scripts/refuse.sh --keep-open "Nothing was done yet: this front door's App is not working (its id or private key here is wrong, or GitHub did not answer), which is for the owner of this repository to put right; the run is $RUN. This issue stays open, and its run can be started again once that is done."
            exit 1
          fi
          if [ "$permission" != admin ]; then
            bash start/scripts/refuse.sh "Nothing was done: the OpenSpine SDLC App is not installed on $TARGET, or not given that repository, or your account is not one of its administrators. Install the App at https://github.com/apps/openspine-sdlc/installations/new and choose the repository, then open a new request with the form as an administrator of it; this one is closed."
          fi

      # What the second job reads: a refusal here means nothing to adopt.
      - name: Say whether the request goes on
        id: verdict
        if: always()
        run: echo "refused=${REFUSED:-false}" >> "$GITHUB_OUTPUT"

      # Not after a refusal, which said what was wrong already; that holds
      # for the one about a broken App, which ends the run red on purpose.
      - name: Say so when something failed
        if: failure() && env.REFUSED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Something went wrong while handling this request, and it stopped; the run is $RUN. This issue stays open for the owner of this repository to look at."

  # The adoption itself, shared with the sweep; the secrets it needs are
  # this repository's own.
  adopt:
    needs: request
    if: needs.request.result == 'success' && needs.request.outputs.refused != 'true'
    uses: ./.github/workflows/adopt-run.yml
    with:
      repository: ${{ needs.request.outputs.repository }}
      mode: ${{ needs.request.outputs.mode }}
      metrics: ${{ needs.request.outputs.metrics }}
      requester: ${{ github.event.issue.user.login }}
      issue: ${{ github.event.issue.number }}
    secrets: inherit
