name: Adopt the SDLC template
description: One pull request with the OpenSpine SDLC template, or its claim protocol, into your repository.
title: "Adopt"
labels: ["adopt"]
body:
  - type: markdown
    attributes:
      value: |
        Installed the App and landed here? Press Create: the pull request is open in that repository in about two minutes, with the whole template for an empty repository and the protocol alone for one with files. Came here on your own? Install the App first (https://github.com/apps/openspine-sdlc/installations/new) or name the repository below. With the Setup App on the repository too (https://github.com/apps/openspine-sdlc-setup/installations/new, "Only select repositories"), the run also applies its settings; that App holds Administration for this one run, and you uninstall it afterwards. This issue is public: a name typed here shows, an installation's number says nothing.
  - type: input
    id: installation_id
    attributes:
      label: Installation
      description: Filled in by GitHub after the install. Leave it.
    validations:
      required: false
  - type: input
    id: repository
    attributes:
      label: Repository
      description: OWNER/NAME, only when you came here without installing. With an installation, the run takes its one repository with no adoption yet, or the newest created among several.
      placeholder: OWNER/NAME
    validations:
      required: false
  - type: checkboxes
    id: options
    attributes:
      label: Options
      options:
        - label: Do not share anonymous aggregates (counts, durations and rates of the protocol at work, never code, text or names; the switch is .github/sdlc-metrics)
        - label: The protocol only, even into an empty repository
