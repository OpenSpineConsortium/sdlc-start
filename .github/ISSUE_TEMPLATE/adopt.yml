name: Adopt Symphony
description: One pull request with the Symphony template, or its claim protocol, into your repository.
title: "Adopt"
labels: ["adopt"]
body:
  - type: markdown
    attributes:
      value: |
        Landed here from the install? Press Create: the pull request opens in the repository named below or, when none is named, in the newest repository the installation reaches that has no adoption yet, within about two minutes; press Create again for the next. Both Apps are needed: SymphonyBoard (https://github.com/apps/symphonyboard/installations/new) opens the pull request; Symphony Setup (https://github.com/apps/symphony-setup/installations/new, "Only select repositories", that one) holds Administration for the one run, applies the repository's settings and uninstalls itself. A request for a repository without the Setup App is refused, with its install link. This issue is public: a name typed here shows, an installation's number says nothing.
  - type: input
    id: installation_id
    attributes:
      label: Installation
      description: Filled in by GitHub after the install. Leave it.
    validations:
      required: false
  # The id is state, not repository: GitHub returns the install link's
  # state parameter in the Setup URL's query, and an issue form fills the
  # field whose id matches a query parameter, as installation_id is filled
  # above, so the repository the extension's button was pressed on arrives
  # filled in.
  - type: input
    id: state
    attributes:
      label: Repository
      description: OWNER/NAME. Filled in when you came from the extension's button; type it when you came here on your own.
      placeholder: OWNER/NAME
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - "Auto: the whole template into an empty repository, the protocol alone into one with files"
        - "Empty repository: the whole template"
        - "Existing repository: the protocol only"
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: options
    attributes:
      label: Options
      options:
        - label: Merge the pull request for me
        - label: Do not share anonymous aggregates (counts, durations and rates of the protocol at work, never code, text or names; the switch is .github/symphony-metrics)
