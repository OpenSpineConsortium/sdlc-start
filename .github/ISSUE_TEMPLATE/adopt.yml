name: Adopt Symphony
description: One pull request with the Symphony template, or its claim protocol, into your repository.
title: "Adopt"
labels: ["adopt"]
body:
  - type: markdown
    attributes:
      value: |
        Installed the App and landed here? Press Create: a pull request is open in each repository the installation reaches that has no adoption yet, within about two minutes. For the repository's settings too (ruleset, auto-merge, secret scanning), install the Setup App first, https://github.com/apps/symphony-setup/installations/new ("Only select repositories"): it brings you back here, holds Administration for the one run, and uninstalls itself when done. Came here on your own? Install the App first (https://github.com/apps/symphony-dev/installations/new) or name the repository below. This issue is public: a name typed here shows, an installation's number says nothing.
  - type: input
    id: installation_id
    attributes:
      label: Installation
      description: Filled in by GitHub after the install. Leave it.
    validations:
      required: false
  - type: input
    id: repository
    attributes:
      label: Repository
      description: OWNER/NAME, only when you came here without installing.
      placeholder: OWNER/NAME
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - "Auto: the whole template into an empty repository, the protocol alone into one with files"
        - "Empty repository: the whole template"
        - "Existing repository: the protocol only"
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: options
    attributes:
      label: Options
      options:
        - label: Merge the pull request for me
        - label: Do not share anonymous aggregates (counts, durations and rates of the protocol at work, never code, text or names; the switch is .github/symphony-metrics)
